name: RDX AI Studio - Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: System dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-virtualenv autoconf automake autopoint build-essential ccache gettext libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev libssl-dev libtool libtool-bin pkg-config zlib1g-dev cmake
          sudo apt-get clean
      - name: Rust
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel virtualenv
          python -m pip install --upgrade buildozer cython==0.29.34
          buildozer --version
      - name: Validate
        run: |
          test -f main.py
          python -m py_compile main.py
      - name: Build APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: '1'
        run: buildozer -v android debug
      - name: Collect APK
        run: |
          set -eux
          APK=$(find bin -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "RDX-AI-Studio-${RELEASE_TAG}.apk"
          sha256sum "RDX-AI-Studio-${RELEASE_TAG}.apk"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDX-AI-Studio-APK
          path: RDX-AI-Studio-${{ env.RELEASE_TAG }}.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RDX AI Studio ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          files: RDX-AI-Studio-${{ env.RELEASE_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
